name: Build SillyClient iOS (Xcode & Simulator Verification)

on:
  push:
    branches: [main, feature/sillyclient-ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-simulate:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      APP_VERSION: 1.11.0
      SILLYCLIENT_TEST_TMP: /tmp/sillyclient-tests-${{ github.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up frontend build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Verify iOS runtime regressions
        run: node --test tests/ios-runtime.test.mjs tests/ios-ci.test.mjs tests/ios-supervisor.test.mjs tests/ios-feature-sync.test.mjs

      - name: Build the real React console
        working-directory: web/capacitor-ui
        run: |
          pnpm install --frozen-lockfile
          node --test tests/*.test.cjs
          pnpm run build

      - name: Prepare the official NodeMobile 18.20.4 XCFramework
        run: |
          curl --fail --location --retry 3 \
            --output nodejs-mobile-v18.20.4-ios.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip
          unzip -q nodejs-mobile-v18.20.4-ios.zip
          mv NodeMobile.xcframework native-src/
          test -f native-src/NodeMobile.xcframework/Info.plist

      - name: Prepare the pinned SillyTavern runtime without API credentials
        run: |
          git init sillytavern-src
          git -C sillytavern-src remote add origin https://github.com/SillyTavern/SillyTavern.git
          git -C sillytavern-src fetch --depth 1 origin 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          git -C sillytavern-src checkout --detach FETCH_HEAD
          cd sillytavern-src
          npm ci --omit=dev --omit=optional --ignore-scripts
          node ../native-src/patch-sillytavern.mjs ./
          cp default/config.yaml config.yaml
          node --input-type=module -e "
            import fs from 'node:fs';
            import yaml from 'yaml';
            const config = yaml.parse(fs.readFileSync('config.yaml', 'utf8'));
            config.listen = false;
            config.whitelistMode = false;
            config.browserLaunch = { ...config.browserLaunch, enabled: false };
            fs.writeFileSync('config.yaml', yaml.stringify(config));
          "
          ST_DISABLE_SHARP=true node ../scripts/prepare-ios-frontend.mjs .
          mkdir -p backups/_migration data/_storage data/_errors data/default-user
          cp ../native-src/ios-loader.mjs ../native-src/patch-sillytavern.mjs ./
          rm -rf .git

      - name: Match the embedded runtime for host compatibility tests
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.4

      - name: Verify actual server startup with WASM disabled
        env:
          SILLYCLIENT_IOS_SERVER: ${{ github.workspace }}/sillytavern-src
          SILLYCLIENT_TEST_LOG: ${{ github.workspace }}/evidence/server-smoke.log
        run: |
          mkdir -p evidence
          node --test tests/ios-runtime.test.mjs tests/ios-server.test.mjs

      - name: Restore the frontend tool runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize the Capacitor iOS project
        working-directory: web/capacitor-ui
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios

      - name: Configure the native source and CocoaPods
        run: |
          cp native-src/Info.plist web/capacitor-ui/ios/App/App/Info.plist
          cp native-src/AppDelegate.swift web/capacitor-ui/ios/App/App/AppDelegate.swift
          rm -rf web/capacitor-ui/ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp -R native-src/Assets.xcassets/AppIcon.appiconset web/capacitor-ui/ios/App/App/Assets.xcassets/
          node --input-type=module -e "
            import fs from 'node:fs';
            const configPath = 'web/capacitor-ui/ios/App/App/capacitor.config.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            config.packageClassList = ['TarvenEnvPlugin', 'SillyClientCore.TarvenEnvPlugin'];
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
            const podfile = 'web/capacitor-ui/ios/App/Podfile';
            const source = fs.readFileSync(podfile, 'utf8');
            if (!source.includes(\"target 'App' do\")) throw new Error('Missing App target');
            fs.writeFileSync(podfile, source.replace(\"target 'App' do\",
              \"target 'App' do\n  pod 'Yams', :git => 'https://github.com/jpsim/Yams.git', :commit => '3d6871d5b4a5cd519adf233fbb576e0a2af71c17'\n  pod 'ZIPFoundation', :git => 'https://github.com/weichsel/ZIPFoundation.git', :commit => '02b6abe5f6eef7e3cbd5f247c5cc24e246efcfe0'\n  pod 'SillyClientCore', :path => '../../../../native-src'\"));
          "
          cd web/capacitor-ui/ios/App
          pod install

      - name: Archive the unsigned physical-device binary
        run: |
          mkdir -p evidence
          cd web/capacitor-ui/ios/App
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$GITHUB_WORKSPACE/evidence/xcode-archive.log"

      - name: Package the unsigned IPA (requires user signing)
        run: |
          cd web/capacitor-ui/ios/App
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/SillyClient.app
          cp -R "$GITHUB_WORKSPACE/sillytavern-src" build/Payload/SillyClient.app/sillytavern
          cd build
          zip -qr "$GITHUB_WORKSPACE/SillyClient-iOS-v${APP_VERSION}-unsigned.ipa" Payload
          shasum -a 256 "$GITHUB_WORKSPACE/SillyClient-iOS-v${APP_VERSION}-unsigned.ipa" \
            > "$GITHUB_WORKSPACE/evidence/ipa-sha256.txt"

      - name: Build and verify the actual hosted simulator application
        run: |
          xcrun simctl list devices available --json > evidence/simulator-devices.json
          DEVICE_UUID=$(node --input-type=module -e "
            import fs from 'node:fs';
            const devices = Object.values(JSON.parse(fs.readFileSync('evidence/simulator-devices.json')).devices).flat();
            const device = devices.find(item => item.isAvailable && /iPhone.*Pro/.test(item.name))
              ?? devices.find(item => item.isAvailable && /iPhone/.test(item.name));
            if (!device) throw new Error('No available iPhone simulator');
            process.stdout.write(device.udid);
          ")
          # Simulator application claims belong in the linked Mach-O, not its host signature.
          ruby <<'RUBY'
          require 'xcodeproj'
          require 'shellwords'
          project = Xcodeproj::Project.open('web/capacitor-ui/ios/App/App.xcodeproj')
          targets = project.targets.select { |target| target.name == 'App' }
          raise 'Expected exactly one App target' unless targets.length == 1
          configurations = targets.first.build_configurations.select { |config| config.name == 'Debug' }
          raise 'Expected exactly one App Debug configuration' unless configurations.length == 1
          entitlements = File.expand_path('scripts/ios-simulator.entitlements')
          raise 'Missing simulator entitlements' unless File.file?(entitlements)
          settings = configurations.first.build_settings
          key = 'OTHER_LDFLAGS[sdk=iphonesimulator*]'
          existing = settings[key] || settings['OTHER_LDFLAGS'] || '$(inherited)'
          flags = existing.is_a?(Array) ? existing.dup : Shellwords.split(existing)
          flags.unshift('$(inherited)') unless flags.include?('$(inherited)')
          linker_flag = "-Wl,-sectcreate,__TEXT,__entitlements,#{entitlements}"
          flags << linker_flag unless flags.include?(linker_flag)
          settings[key] = flags
          project.save
          RUBY
          cd web/capacitor-ui/ios/App
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "id=$DEVICE_UUID" \
            -derivedDataPath build/derived build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee "$GITHUB_WORKSPACE/evidence/xcode-simulator.log"
          cd "$GITHUB_WORKSPACE"
          APP_PATH=web/capacitor-ui/ios/App/build/derived/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP_PATH"
          cp -R sillytavern-src "$APP_PATH/sillytavern"
          for COMPONENT in "$APP_PATH"/Frameworks/*.framework "$APP_PATH"/Frameworks/*.dylib; do
            if [ -e "$COMPONENT" ]; then codesign --force --sign - "$COMPONENT"; fi
          done
          codesign --force --sign - "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" > evidence/simulator-codesign.log 2>&1
          codesign --verify --deep --strict "$APP_PATH"
          # Classic verbose section output is byte-oriented on either host endianness.
          xcrun otool-classic -arch "$(uname -m)" -X -V -s __TEXT __entitlements "$APP_PATH/App" \
            > evidence/simulator-entitlements-macho.txt
          node --input-type=module <<'ENTITLEMENTS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dump = fs.readFileSync('evidence/simulator-entitlements-macho.txt', 'utf8');
          const rows = dump.trim().split(/\r?\n/).filter(row => row.trim());
          assert.ok(rows.length > 0, 'No linked simulator entitlement bytes');
          const chunks = [];
          let nextAddress;
          for (const row of rows) {
            const [address, ...hex] = row.split('|', 1)[0].trim().split(/\s+/);
            assert.ok(row.includes('|') && /^[0-9a-f]{8,16}$/i.test(address)
              && hex.length > 0 && hex.length <= 16 && hex.every(byte => /^[0-9a-f]{2}$/i.test(byte)),
              'Invalid simulator entitlement byte row');
            const start = BigInt(`0x${address}`);
            if (nextAddress !== undefined) {
              assert.equal(start, nextAddress, 'Noncontiguous simulator entitlement byte rows');
            }
            nextAddress = start + BigInt(hex.length);
            chunks.push(Buffer.from(hex.join(''), 'hex'));
          }
          const linked = Buffer.concat(chunks);
          assert.ok(linked.length > 0 && linked.length <= 65536, 'Invalid linked simulator entitlement size');
          fs.writeFileSync('evidence/simulator-entitlements.plist', linked);
          ENTITLEMENTS
          ruby <<'VERIFY'
          require 'xcodeproj'
          identity = 'SCIOSDEBUG.com.sillyclient.ios'
          linked = Xcodeproj::Plist.read_from_path('evidence/simulator-entitlements.plist')
          expected = Xcodeproj::Plist.read_from_path('scripts/ios-simulator.entitlements')
          raise 'Incorrect linked application identity' unless linked['application-identifier'] == identity
          raise 'Incorrect linked Keychain group' unless linked['keychain-access-groups'] == [identity]
          raise 'Linked simulator entitlements differ from the source' unless linked == expected
          VERIFY
          node scripts/simulator-recorder.mjs "$DEVICE_UUID" evidence &
          RECORDER_PID=$!
          set +e
          node scripts/run-ios-e2e.mjs "$DEVICE_UUID" "$APP_PATH"
          E2E_STATUS=$?
          set -e
          kill -INT $RECORDER_PID 2>/dev/null || true
          wait $RECORDER_PID 2>/dev/null || true
          if [ $E2E_STATUS -ne 0 ]; then
            echo "E2E runner exited with error status: $E2E_STATUS"
            exit $E2E_STATUS
          fi

      - name: Package the authentic iOS Simulator app for Sauce Labs / Appetize
        if: always()
        run: |
          SIM_DIR="web/capacitor-ui/ios/App/build/derived/Build/Products/Debug-iphonesimulator"
          if [ -d "$SIM_DIR/App.app" ]; then
            cd "$SIM_DIR"
            zip -qr "$GITHUB_WORKSPACE/SillyClient-iOS-Simulator.app.zip" App.app
            cd "$GITHUB_WORKSPACE"
            shasum -a 256 SillyClient-iOS-Simulator.app.zip > evidence/simulator-app-sha256.txt
          fi

      - name: Upload the iOS Simulator app archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SillyClient-iOS-Simulator-App
          path: SillyClient-iOS-Simulator.app.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the unsigned build archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SillyClient-iOS-v1.11.0-unsigned-IPA
          path: SillyClient-iOS-v1.11.0-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload real simulator and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
